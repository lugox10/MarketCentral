packages:
  - apps/*
  - packages/*

allowBuilds:
  '@swc/core': true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  argon2: true
  sharp: true
  unrs-resolver: true
  '@parcel/watcher': true
  '@scarf/scarf': false


minimumReleaseAgeExclude:
  - '@nestjs/common@12.5.0'
  - '@nestjs/core@12.5.0'
  - '@nestjs/platform-express@12.5.0'
  - '@nestjs/testing@12.5.0'
  - 'electron-to-chromium@1.5.483'
  - 'encodeurl@2.0.3'
  - 'enhanced-resolve@5.27.0'
  - 'graceful-fs@4.2.12'
  - 'prettier@3.10.1'
