# Blueprint de Render para la API de MarketCentral (plan Free: $0, sin tarjeta).
#
# El servicio se duerme a los 15 minutos sin tráfico y despierta con la primera
# petición (~50 s). Para producción real, subir `plan` a `starter`.
#
# Solo se piden en el asistente los dos secretos de base de datos. Correo y
# almacenamiento se añaden después en Dashboard → Environment (y se redepliega),
# para que el primer deploy no exija valores de relleno.
#
# La base de datos vive en Neon. Las migraciones se aplican desde tu máquina
# contra DIRECT_URL antes del deploy:
#   pnpm --filter @marketcentral/api exec prisma migrate deploy

services:
  - type: web
    name: marketcentral-api
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    dockerCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # --- plataforma ---
      - key: NODE_ENV
        value: production
      # Render inyecta PORT; API_PORT queda como respaldo local.
      - key: API_PORT
        value: 3001

      # --- base de datos (Neon) ---
      # DATABASE_URL: cadena *pooled* (host con -pooler); la usa la API.
      - key: DATABASE_URL
        sync: false
      # DIRECT_URL: cadena directa; solo para migraciones y administración.
      - key: DIRECT_URL
        sync: false

      # --- web ---
      # Sin "*" en producción. Cuando despliegues la web, cambia este valor.
      - key: CORS_ORIGINS
        value: http://localhost:3000

      # --- secretos propios ---
      # generateValue: Render los crea una vez y no cambian entre deploys.
      - key: FORM_TOKEN_SECRET
        generateValue: true
      - key: IP_HASH_SECRET
        generateValue: true

      # --- operación ---
      - key: OUTBOX_ENABLED
        value: true
      - key: MEDIA_PURGE_ENABLED
        value: true
      - key: MEDIA_PURGE_ARCHIVED_DAYS
        value: 90
      - key: PUBLIC_RATE_LIMIT
        value: 180

      # --- pendientes de configurar en el panel ---
      # RESEND_API_KEY · MAIL_FROM · MAIL_REPLY_TO   → correo real
      # MEDIA_S3_ENDPOINT · MEDIA_S3_BUCKET · MEDIA_S3_REGION
      # MEDIA_S3_ACCESS_KEY_ID · MEDIA_S3_SECRET_ACCESS_KEY → bucket de imágenes
      # MEDIA_PUBLIC_BASE_URL → https://<servicio>.onrender.com/media
      # NEXT_PUBLIC_SITE_URL  → dominio del frontend
